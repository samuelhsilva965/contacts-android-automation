name: Appium Tests - App Nativo Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_path:
        description: 'Caminho do teste a rodar (deixe vazio para rodar todos)'
        required: false
        default: ''

env:
  ANDROID_API_LEVEL: 31
  ANDROID_TARGET: google_apis
  ANDROID_ARCH: x86_64
  ANDROID_PROFILE: pixel_6
  ANDROID_AVD_NAME: contacts_pt_br

permissions:
  contents: write

jobs:
  appium-android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Instalar Appium e driver UiAutomator2
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache do AVD (com locale pt-BR já configurado)
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_TARGET }}-${{ env.ANDROID_ARCH }}-${{ env.ANDROID_PROFILE }}-pt-BR-v1

      - name: Criar AVD, ajustar locale para pt-BR e gerar snapshot (só roda se o cache não existir)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          profile: ${{ env.ANDROID_PROFILE }}
          avd-name: ${{ env.ANDROID_AVD_NAME }}
          force-avd-creation: false
          emulator-options: >
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          disable-animations: false
          script: |
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do echo "Aguardando boot inicial completar..."; sleep 2; done

            echo "Ajustando locale para pt-BR..."
            adb shell settings put system system_locales pt-BR
            adb reboot

            echo "Aguardando reboot..."
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do echo "Aguardando boot pós-reboot completar..."; sleep 2; done

            echo "Locale final gravado no snapshot:"
            adb shell getprop persist.sys.locale

            adb shell pm grant com.android.contacts android.permission.READ_CONTACTS
            adb shell pm grant com.android.contacts android.permission.WRITE_CONTACTS

            echo "Snapshot será salvo automaticamente ao encerrar este step."

      - name: Subir emulador a partir do snapshot e rodar testes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          profile: ${{ env.ANDROID_PROFILE }}
          avd-name: ${{ env.ANDROID_AVD_NAME }}
          force-avd-creation: false
          emulator-options: >
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do echo "Aguardando boot completar..."; sleep 2; done

            echo "Locale ao subir do snapshot:"
            adb shell getprop persist.sys.locale

            adb devices

            appium --log-timestamp --log appium.log > /dev/null 2>&1 &
            APPIUM_PID=$!
            sleep 10

            pytest ${{ github.event.inputs.test_path || 'tests/' }} --junitxml=results.xml --alluredir=allure-results -v
            TEST_EXIT_CODE=$?

            kill $APPIUM_PID || true

            exit $TEST_EXIT_CODE

      - name: Instalar Allure CLI
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          curl -o allure-2.29.0.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxvf allure-2.29.0.tgz -C /opt/
          sudo ln -s /opt/allure-2.29.0/bin/allure /usr/bin/allure

      - name: Gerar relatório Allure
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: Publicar relatório no GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
